[tool.poetry]
name = "obd2-service"
version = "0.1.0"
description = "OBD2 Data Pipeline Service for Honda Accord diagnostics"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0"
pymysql = "^1.1.0"
pandas = "^2.0.0"
python-dotenv = "^1.0.0"
pydantic = "^2.0.0"
cryptography = "^41.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.11.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
